<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบตรวจสินค้าใหม่ RA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exact QC paperwork — a checker's desk, no decoration
   IDEA: a product spec docket that moves from purchasing to RA and gets stamped
   PICTURE: the docket itself — ingredient meter that must hit 100%, process-flow chain, status stamp
   COLOUR and TYPE: banana-leaf green band, white paper, stamp red for reject; IBM Plex Sans Thai
   LAYOUT: queue on the left, docket on the right; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f0,#0f1411);--paper:light-dark(#fff,#18201b);--ink:light-dark(#142019,#e6ece7);--mute:light-dark(#5a685e,#98a69c);
--line:light-dark(#dbe1d8,#2b362f);--soft:light-dark(#f7f9f5,#1e2822);--band:light-dark(#1c4a2e,#0b1a11);--leaf:light-dark(#1f6b3c,#6cc28a);
--ok:light-dark(#1b7a42,#62c98a);--okb:light-dark(#e3f4e8,#15301f);--warn:light-dark(#9a6412,#e8b257);--warnb:light-dark(#fbf0db,#2d2412);
--bad:light-dark(#c0322a,#ff7d70);--badb:light-dark(#fbe6e3,#351816)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
.top{background:var(--band);color:#f1f6f1;padding:22px max(4vw,16px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-weight:700}
.top p{margin:4px 0 0;color:#bcd3c3;font-size:15px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:#dfeee3;padding:10px 18px;border-radius:9px;min-height:44px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:#fff;color:#173a25}
.note{margin:12px max(4vw,16px) 0;padding:10px 14px;border-radius:10px;background:var(--warnb);color:var(--warn);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;padding:20px max(4vw,16px) 40px;max-width:1300px;margin:0 auto}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px}
.side-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.side-h h2{margin:0;font-size:17px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer}
.item[aria-current=true]{border-color:var(--leaf);box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf) 30%,transparent)}
.item b{display:block;font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--mute);font-size:13px;display:block;margin-top:4px}
.item .why{color:var(--bad);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.s-draft{background:var(--soft);color:var(--mute);border:1px solid var(--line)}.s-sub{background:var(--warnb);color:var(--warn)}
.s-rej{background:var(--badb);color:var(--bad)}.s-ok{background:var(--okb);color:var(--ok)}
.empty{color:var(--mute);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.icon{border:0;background:none;width:40px;height:40px;border-radius:8px;cursor:pointer;color:var(--mute);font-size:18px;flex:none}
.icon:hover:not(:disabled){background:var(--soft);color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--leaf) 60%,transparent);outline-offset:2px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.sheet-h{padding:22px clamp(16px,3vw,30px) 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.sheet-h h2{margin:6px 0 0;font-size:clamp(24px,3vw,32px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px}
.sec{padding:20px clamp(16px,3vw,30px);border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h3{margin:0;font-size:18px}
.ck{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.ck.y{background:var(--okb);color:var(--ok)}.ck.n{background:var(--badb);color:var(--bad)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:9px 12px;font-size:16px;min-height:44px}
input:focus,textarea:focus{border-color:var(--leaf);outline:none;background:var(--paper)}
input:disabled,textarea:disabled{background:transparent;border-color:transparent;padding-inline:0}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:center}
.r-ing{grid-template-columns:minmax(0,1fr) 120px 40px}.r-nut{grid-template-columns:minmax(0,1fr) 110px 80px 40px}
.r-flow{grid-template-columns:32px minmax(0,1fr) 40px 40px 40px}
.r-head{font-size:13px;color:var(--mute)}
@media(max-width:520px){.r-ing{grid-template-columns:minmax(0,1fr) 92px 40px}.r-nut{grid-template-columns:minmax(0,1fr) 78px 62px 40px}.r-flow{grid-template-columns:26px minmax(0,1fr) 40px}.r-flow .mv{display:none}}
.n{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.add{margin-top:10px}
.meter{margin-top:14px;padding:14px;border-radius:12px;background:var(--soft)}
.meter .track{height:14px;border-radius:7px;background:var(--line);overflow:hidden;position:relative}
.meter .fill{height:100%;border-radius:7px;transition:width .3s}
.meter .lab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:15px}
.meter .big{font-size:24px;font-weight:700;white-space:nowrap}
.banner{margin:16px clamp(16px,3vw,30px) 0;padding:12px 16px;border-radius:12px;background:var(--badb);color:var(--bad);font-size:15px}
.banner b{display:block}
.bar{position:sticky;bottom:0;background:var(--paper);padding:16px clamp(16px,3vw,30px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.miss{font-size:14px;color:var(--bad);margin:0;padding:0;list-style:none}
.miss.okk{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:13px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
.chain{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;max-width:560px;width:100%}
.arrow{width:2px;height:18px;background:var(--leaf);margin-inline-start:28px;position:relative}
.arrow::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--leaf);border-bottom:0}
.stamp{position:absolute;top:22px;right:clamp(16px,3vw,30px);transform:rotate(-8deg);border:3px solid currentColor;border-radius:8px;padding:4px 14px;font-weight:700;font-size:20px;letter-spacing:.02em;opacity:.9;pointer-events:none}
.stamp.bad{color:var(--bad)}.stamp.ok{color:var(--ok)}.stamp.sub{color:var(--warn)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.checks div{border-radius:10px;padding:10px 12px;font-size:14px}
.checks .y{background:var(--okb);color:var(--ok)}.checks .n{background:var(--badb);color:var(--bad)}
.decide{display:flex;flex-direction:column;gap:12px}
.boxes{display:flex;flex-wrap:wrap;gap:8px}
.boxes label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:15px}
.boxes input{width:18px;height:18px;accent-color:var(--bad)}
.hist{list-style:none;margin:0;padding:0;font-size:14px;color:var(--mute)}
.hist li{padding:6px 0;border-bottom:1px dashed var(--line)}.hist li b{color:var(--ink);font-weight:600}
.intro{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,40px)}
.intro h2{margin:0 0 8px;font-size:clamp(24px,3vw,32px);line-height:1.1}
.req{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:18px 0}
.req div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.req b{display:block}.req span{font-size:14px;color:var(--mute)}
.sample{font-size:13px;color:var(--mute)}
.tk{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}.ingt tr.done td{background:var(--okb)}
.drv{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.dlink{color:var(--leaf);font-weight:600}.dwarn{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.meter .fill{transition:none}}
.files{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 8px 8px 12px}
.file .ft{flex:none;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--leaf)}
.file .ft.pdf{background:#b3382c}.file .ft.img{background:#2f6fa8}.file .ft.txt{background:#6a6f68}
.file .fn{flex:1;overflow-wrap:anywhere;font-size:15px}.file .fn small{display:block;color:var(--mute);font-size:13px}
.file a{color:var(--leaf);font-weight:600;white-space:nowrap;font-size:14px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:18px;cursor:pointer;color:var(--mute);font-size:14px;min-height:96px}
.drop b{color:var(--ink);font-size:16px}.drop:hover,.drop.over{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 6%,transparent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:3px solid color-mix(in srgb,var(--leaf) 60%,transparent)}
.uperr{color:var(--bad);font-size:14px;margin-top:6px}.upnow{color:var(--warn);font-size:14px;margin-top:6px}
.setbtn{border:1px solid rgba(255,255,255,.35);background:none;color:#f1f6f1;border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
.setp{background:var(--paper);border-bottom:1px solid var(--line);padding:18px max(4vw,16px)}
.setp .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;max-width:1240px}
.setp label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.sub-h{font-size:15px;font-weight:600;margin:16px 0 8px}
</style></head><body>
<header class="top">
  <div><h1>ระบบตรวจสินค้าใหม่</h1><p>จัดซื้อกรอกชื่อและแนบไฟล์ครบ 3 ส่วน → เก็บใน Google Drive → RA ตรวจ → Approve หรือ Reject · <a href="https://drive.google.com/drive/folders/1BEopI-OxSE1of60Zzutl9jUX_uBPF9g9" target="_blank" rel="noopener" style="color:#fff">โฟลเดอร์ Drive ↗</a></p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="who" style="color:#cfe3d4;font-size:14px"></span><button class="setbtn" id="setbtn">⚙ ตั้งค่า</button><div class="seg" id="seg"><button data-role="buy" aria-pressed="false">ฝ่ายจัดซื้อ</button><button data-role="ra" aria-pressed="false">RA ตรวจสินค้า</button></div></div>
</header>
<div id="setp" class="setp" hidden></div>
<div id="note" class="note" hidden></div>
<main class="wrap"><aside class="side"><div class="side-h" id="sideH"></div><div class="rows" id="list"><div class="empty">กำลังโหลดข้อมูล…</div></div></aside><section id="pane"></section></main>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={draft:['ร่าง','s-draft'],submitted:['รอ RA ตรวจ','s-sub'],rejected:['ถูก Reject','s-rej'],approved:['อนุมัติแล้ว','s-ok']};
const SEC={name:'ชื่อสินค้า',ing:'Ingredient',nut:'Nutrition',flow:'Process Flow'};
const FSEC=['ing','nut','flow'];
/* ===== ตั้งค่า: วาง URL ของ Apps Script Web app ที่นี่ (ลงท้ายด้วย /exec) ===== */
const API_URL_DEFAULT='https://script.google.com/macros/s/AKfycbzNK_b4Bf41LapTS9SAa3ukypdE0NmHFtoCgIhK2rS1cIgytk74tnrDSCITfRobNt0/exec';
const MAXB=10*1024*1024;
let cfg={api:API_URL_DEFAULT,key:'',me:'',role:''};
try{cfg={...cfg,...JSON.parse(localStorage.getItem('ra-cfg')||'{}')};if(!cfg.api)cfg.api=API_URL_DEFAULT}catch(e){}
let raDraft={id:null,reason:'',secs:[],tick:{}},items=[],role='buy',sel=null,cur=null,dirty=false,raFilter='submitted',delArm=false,busy=false;
const uploading={},upErr={},mem=new Map();
try{role=localStorage.getItem('ra-role')==='ra'?'ra':'buy'}catch(e){}
const now=()=>Date.now();
const fmt=t=>t?new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'';
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN};
const sumIng=p=>Math.round((p.ingredients||[]).reduce((a,r)=>a+(num(r.pct)||0),0)*1000)/1000;
const who=n=>n||'ไม่ระบุชื่อ';
const chip=s=>`<span class="chip ${ST[s]?.[1]||'s-draft'}">${ST[s]?.[0]||s}</span>`;
const note=t=>{const n=$('#note');n.hidden=!t;n.textContent=t||''};
const files=(p,k)=>(p.files&&p.files[k])||[];
const kb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

function checks(p){
  const ing=p.ingredients||[],s=sumIng(p);
  const rows=ing.length>0&&ing.every(r=>String(r.name).trim()&&num(r.pct)>0);
  const fi=files(p,'ing').length>0;
  return{
    name:{ok:!!String(p.name||'').trim(),msg:'ยังไม่ได้กรอกชื่อสินค้า'},
    ing:{ok:fi&&rows&&Math.abs(s-100)<0.001,msg:!fi?'ยังไม่ได้แนบไฟล์ Ingredient':!rows?'ทุกแถวต้องมีชื่อวัตถุดิบและ % มากกว่า 0':`รวม ${s}% ต้องเท่ากับ 100%`},
    nut:{ok:files(p,'nut').length>0,msg:'ยังไม่ได้แนบไฟล์ Nutrition'},
    flow:{ok:files(p,'flow').length>0,msg:'ยังไม่ได้แนบไฟล์ Process Flow'}};
}
const allOk=c=>Object.values(c).every(x=>x.ok);
const blank=()=>({id:'p'+now().toString(36)+Math.random().toString(36).slice(2,7),name:'',ingredients:[{name:'',pct:''}],files:{ing:[],nut:[],flow:[]},
  status:'draft',rejectReason:'',rejectSections:[],createdBy:cfg.me,createdAt:now(),updatedAt:now(),history:[]});
const clone=o=>JSON.parse(JSON.stringify(o));

async function save(p){
  p.updatedAt=now();
  const body=clone(p);const id=body.id;delete body.id;
  const r=await api('save',{item:{...body,id}});
  const it=r.item;p.folder=it.folder||null;p.drive=it.drive||null;p.updatedAt=it.updatedAt;
  items=[it,...items.filter(x=>x.id!==it.id)].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  renderSide();return it;
}
async function act(fn){if(busy)return;busy=true;try{await fn()}catch(e){note('บันทึกไม่สำเร็จ: '+apiMsg(e))}finally{busy=false}}
const log=(p,action,txt)=>{p.history=[...(p.history||[]),{at:now(),by:cfg.me,action,note:txt||''}]};

/* ---------- Apps Script API ---------- */
async function api(action,data){
  if(!cfg.api)throw{code:'no_api'};
  let res;
  try{res=await fetch(cfg.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key:cfg.key,by:cfg.me,...data})})}
  catch(e){throw{code:'network'}}
  let j;try{j=await res.json()}catch(e){throw{code:'bad_response'}}
  if(!j.ok)throw{code:j.code||'server',message:j.error};
  return j;
}
function apiMsg(e){const c=e&&e.code;
  if(c==='no_api')return'ยังไม่ได้ใส่ URL ของ Apps Script กด ⚙ ตั้งค่า';
  if(c==='bad_key'||c==='no_key')return(e.message||'รหัสไม่ถูกต้อง')+' กด ⚙ ตั้งค่า';
  if(c==='network')return'ติดต่อ Apps Script ไม่ได้ ตรวจอินเทอร์เน็ต หรือ URL ใน ⚙ ตั้งค่า';
  if(c==='bad_response')return'Apps Script ตอบกลับผิดรูปแบบ ตรวจว่า Deploy เป็น Web app และตั้ง Who has access เป็น Anyone';
  return e&&e.message?e.message:'เกิดข้อผิดพลาด';}
async function ensureFolder(p){
  if(p.folder?.id)return p.folder.id;
  await save(p);
  if(!p.folder?.id)throw{code:'server',message:'สร้างโฟลเดอร์สินค้าใน Drive ไม่สำเร็จ'};
  return p.folder.id;
}
function ftype(file){
  const n=file.name.toLowerCase();
  if(file.type==='application/pdf'||n.endsWith('.pdf'))return'application/pdf';
  if(/^image\/(png|jpeg|gif|webp|heic)$/.test(file.type))return file.type;
  if(/\.png$/.test(n))return'image/png';if(/\.jpe?g$/.test(n))return'image/jpeg';
  if(file.type==='text/plain'||n.endsWith('.txt'))return'text/plain';
  return'';
}
const b64=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(r.error);r.readAsDataURL(file)});
async function uploadFile(p,sec,file){
  const folderId=await ensureFolder(p);
  const r=await api('upload',{folderId,sec,fileName:file.name,mimeType:ftype(file),data:await b64(file)});
  return r.file;
}
async function addFiles(sec,list){
  if(!cur)return;
  upErr[sec]='';
  if(!String(cur.name||'').trim()){upErr[sec]='กรอกชื่อสินค้าก่อนแนบไฟล์ เพื่อใช้ตั้งชื่อโฟลเดอร์สินค้าใน Drive';renderForm();$('#f-name')?.focus();return}
  if(!cfg.api||!cfg.key){upErr[sec]=apiMsg({code:cfg.api?'bad_key':'no_api'});renderForm();return}
  const ok=[...list].filter(f=>{if(!ftype(f)){upErr[sec]=`“${f.name}” ไม่ใช่ PDF รูปภาพ หรือไฟล์ข้อความ`;return false}if(f.size>MAXB){upErr[sec]=`“${f.name}” ใหญ่เกิน 10 MB`;return false}return true});
  if(!ok.length){renderForm();return}
  uploading[sec]=ok.length;renderForm();
  const p=cur;
  for(const f of ok){
    try{const meta=await uploadFile(p,sec,f);p.files=p.files||{ing:[],nut:[],flow:[]};p.files[sec]=[...files(p,sec),meta]}
    catch(e){upErr[sec]=`อัปโหลด “${f.name}” ไม่สำเร็จ: ${apiMsg(e)}`}
    uploading[sec]--;
  }
  uploading[sec]=0;
  try{await save(p);dirty=false}catch(e){note('บันทึกรายการไม่สำเร็จ แต่ไฟล์อยู่ใน Drive แล้ว กด “บันทึกร่าง” อีกครั้ง')}
  if(cur===p)renderForm();
}
function driveTag(p){
  const fo=p.folder?.url?`<a class="dlink" href="${esc(p.folder.url)}" target="_blank" rel="noopener">โฟลเดอร์สินค้านี้ใน Drive ↗</a>`:'';
  const dc=p.drive?.url?`<a class="dlink" href="${esc(p.drive.url)}" target="_blank" rel="noopener">เอกสารสรุป ↗</a>`:'';
  return fo+dc;
}
function fileList(p,k,canDel){
  const fs=files(p,k);
  if(!fs.length)return canDel?'':'<div class="empty" style="margin-bottom:10px">ไม่มีไฟล์แนบ</div>';
  return`<div class="files">${fs.map((f,i)=>{const t=f.type==='application/pdf'?['pdf','PDF']:/^image/.test(f.type)?['img','IMG']:['txt','TXT'];
    return`<div class="file"><span class="ft ${t[0]}">${t[1]}</span><span class="fn">${esc(f.name)}<small>${kb(f.size||0)} · ${fmt(f.at)}</small></span>
    <a href="${esc(f.url)}" target="_blank" rel="noopener">เปิดดู ↗</a>${canDel?`<button class="icon" data-act="rm-file" data-s="${k}" data-i="${i}" aria-label="เอาไฟล์ ${esc(f.name)} ออก">✕</button>`:''}</div>`}).join('')}</div>`;
}
function fileBox(p,k,lock){
  return fileList(p,k,!lock)+(lock?'':`<label class="drop" data-drop="${k}"><b>${files(p,k).length?'+ แนบไฟล์เพิ่ม':'แนบไฟล์ '+SEC[k]}</b>
    <span>ลากไฟล์มาวาง หรือคลิกเลือก · PDF รูปภาพ (JPG, PNG) หรือ .txt ไม่เกิน 10 MB</span>
    <input type="file" multiple accept=".pdf,application/pdf,image/*,.txt,text/plain" data-up="${k}"></label>`)
    +(uploading[k]?`<div class="upnow">กำลังอัปโหลดไป Google Drive… (${uploading[k]} ไฟล์)</div>`:'')
    +(upErr[k]?`<div class="uperr">${esc(upErr[k])}</div>`:'');
}

function refresh(){
  if(!cur)return;
  const c=checks(cur),s=sumIng(cur);
  for(const k in c){const t=$('#ck-'+k);if(t){t.className='ck '+(c[k].ok?'y':'n');t.textContent=c[k].ok?'✓ ครบ':'ยังไม่ครบ'}}
  const m=$('#meter');
  if(m){const over=s>100.0005,ok=Math.abs(s-100)<0.001,col=ok?'var(--ok)':over?'var(--bad)':'var(--warn)';
    m.innerHTML=`<div class="track"><div class="fill" style="width:${Math.min(s,100)}%;background:${col}"></div></div>
    <div class="lab"><span>รวมทั้งหมด</span><span class="big" style="color:${col}">${s.toFixed(2)}%</span></div>
    <div class="meta" style="color:${col}">${ok?'ครบ 100% พอดี':over?`เกินอยู่ ${(s-100).toFixed(2)}%`:`ขาดอีก ${(100-s).toFixed(2)}% จึงจะส่งให้ RA ได้`}</div>`}
  const ms=$('#miss'),send=$('#send'),up=FSEC.some(k=>uploading[k]);
  if(ms){const bad=Object.entries(c).filter(([,v])=>!v.ok);
    ms.className='miss'+(bad.length?'':' okk');
    ms.innerHTML=bad.length?bad.map(([k,v])=>`<li>✕ ${SEC[k]}: ${esc(v.msg)}</li>`).join(''):up?'<li>รออัปโหลดไฟล์ให้เสร็จก่อน</li>':'<li>✓ ข้อมูลครบทั้ง 4 ส่วน พร้อมส่ง</li>'}
  if(send)send.disabled=!allOk(c)||up;
}
function hist(p){
  const h=(p.history||[]).slice().reverse();
  if(!h.length)return'';
  const A={submit:'ส่งให้ RA',reject:'Reject',approve:'อนุมัติ'};
  return`<div class="sec"><div class="sec-h"><h3>ประวัติ</h3></div><ul class="hist">${h.map(x=>`<li><b>${A[x.action]||x.action}</b> โดย ${esc(who(x.by))} · ${fmt(x.at)}${x.note?' — '+esc(x.note):''}</li>`).join('')}</ul></div>`;
}

   ${open?'<p class="meta" style="margin-top:0">เปิดไฟล์ด้านบน เทียบกับตาราง แล้วติ๊ก “ตรวจแล้ว” ให้ครบทุกแถวก่อนจึงจะกด Approve ได้</p>':''}

    ${open?`<td class="r"><input type="checkbox" class="tk" data-i="${r.i}" ${dr.tick[r.i]?'checked':''} aria-label="ตรวจ ${esc(r.name)} แล้ว"></td>`:''}</tr>`).join('')}
   </tbody><tfoot><tr><td></td><td>รวม</td><td class="r" style="color:var(--${c.ing.ok?'ok':'bad'})">${s.toFixed(2)}</td>${open?'<td></td>':''}</tr></tfoot></table>

  <div class="sec"><div class="sec-h"><h3>Nutrition</h3><span class="ck ${c.nut.ok?'y':'n'}">${files(p,'nut').length} ไฟล์</span></div>${fileList(p,'nut',false)}</div>
  <div class="sec"><div class="sec-h"><h3>Process Flow</h3><span class="ck ${c.flow.ok?'y':'n'}">${files(p,'flow').length} ไฟล์</span></div>${fileList(p,'flow',false)}</div>
  <div class="sec"><div class="sec-h"><h3>ผลตรวจความครบอัตโนมัติ</h3></div>

   <div class="boxes">${Object.keys(SEC).map(k=>`<label><input type="checkbox" value="${k}" class="rs" ${dr.secs.includes(k)?'checked':''}>${SEC[k]}</label>`).join('')}</div>

   <div class="meta" id="rhint" style="color:var(--bad)" hidden>ใส่เหตุผลก่อนกด Reject</div></div></div>`:''}

function raRefresh(){
  const p=items.find(i=>i.id===sel),st=$('#rastat'),ap=$('#appr');if(!p||!st)return;
  const c=checks(p),n=(p.ingredients||[]).length,t=Object.values(raDraft.tick).filter(Boolean).length,ok=allOk(c)&&t>=n;
  st.innerHTML=!allOk(c)?'<span style="color:var(--bad)">ข้อมูลไม่ครบ อนุมัติไม่ได้ ต้อง Reject กลับ</span>'
    :`ตรวจ Ingredient แล้ว <b>${t}/${n}</b>${t<n?' · ติ๊กให้ครบก่อนอนุมัติ':' · พร้อมอนุมัติ'}`;
  ap.disabled=!ok;
  document.querySelectorAll('.ingt tbody tr').forEach(tr=>{const x=tr.querySelector('.tk');if(x)tr.classList.toggle('done',x.checked)});
}

$('#pane').addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z)z.classList.remove('over')});

$('#pane').addEventListener('input',e=>{const t=e.target;
  if(t.id==='reason'){raDraft.reason=t.value;if(t.value.trim())$('#rhint').hidden=true;return}
  if(t.classList.contains('tk')){raDraft.tick[t.dataset.i]=t.checked;raRefresh();return}
  if(t.classList.contains('rs')){raDraft.secs=[...document.querySelectorAll('.rs:checked')].map(x=>x.value);return}
  if(!cur||t.type==='file')return;
  if(t.dataset.f)cur[t.dataset.f]=t.value;
  else if(t.dataset.a){cur[t.dataset.a][+t.dataset.i][t.dataset.k]=t.value}

  if(t.dataset.f==='name'){const h=$('.sheet-h h2');if(h)h.textContent=t.value||'สินค้าใหม่'}});

      const secs=[...document.querySelectorAll('.rs:checked')].map(x=>x.value);

    if(a==='approve'){if(!allOk(checks(p))||Object.values(raDraft.tick).filter(Boolean).length<(p.ingredients||[]).length)return;
      act(async()=>{const q=clone(p);q.status='approved';q.rejectReason='';q.rejectSections=[];q.reviewedBy=cfg.me;q.reviewedAt=now();log(q,'approve');await save(q);render()})}
    return}
  if(!cur)return;
  if(a==='rm-file'){const s=b.dataset.s;cur.files[s]=files(cur,s).filter((_,j)=>j!==i);dirty=true;renderForm()}
  if(a==='add-ingredients'){cur.ingredients.push({name:'',pct:''});dirty=true;renderForm(`[data-a=ingredients][data-i="${cur.ingredients.length-1}"][data-k=name]`)}
  if(a==='del-ingredients'){cur.ingredients.splice(i,1);dirty=true;renderForm()}
  if(a==='save')act(async()=>{if(!String(cur.name||'').trim()){note('กรอกชื่อสินค้าก่อนบันทึก');return}await save(cur);dirty=false;note('');renderSide();b.textContent='บันทึกแล้ว ✓';setTimeout(()=>{b.textContent='บันทึกร่าง'},1500)});
  if(a==='submit'){if(!allOk(checks(cur))||FSEC.some(k=>uploading[k]))return;
    const q=clone(cur);q.status='submitted';q.submittedAt=now();log(q,'submit');
    b.disabled=true;b.textContent='กำลังส่งและบันทึกลง Drive…';
    act(async()=>{try{await save(q);cur=q;dirty=false}finally{render()}})}
  if(a==='del'){if(!delArm){delArm=true;renderForm();return}
    act(async()=>{const id=cur.id;if(items.some(x=>x.id===id))await api('delete',{id});items=items.filter(x=>x.id!==id);cur=null;delArm=false;render()})}
});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- settings ---------- */
function renderSet(open){
  const p=$('#setp');p.hidden=!open;if(!open)return;
  p.innerHTML=`<div class="grid">
   <label>ชื่อของคุณ (แสดงในประวัติ)<input type="text" id="s-me" value="${esc(cfg.me)}" placeholder="เช่น สมหญิง (จัดซื้อ)"></label>
   <label>รหัสเข้าใช้ (รหัสจัดซื้อ หรือรหัส RA)<input type="text" id="s-key" value="${esc(cfg.key)}" autocomplete="off"></label>
   <label>URL ของ Apps Script (ลงท้ายด้วย /exec)<input type="text" id="s-api" value="${esc(cfg.api)}" placeholder="https://script.google.com/macros/s/…/exec"></label></div>
   <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center"><button class="btn pri" id="s-save">บันทึกและเชื่อมต่อ</button><button class="btn" id="s-close">ปิด</button><span class="meta" id="s-msg"></span></div>`;
}
$('#setbtn').addEventListener('click',()=>renderSet($('#setp').hidden));
$('#setp').addEventListener('click',async e=>{
  if(e.target.id==='s-close'){renderSet(false);return}
  if(e.target.id!=='s-save')return;
  cfg={api:$('#s-api').value.trim(),key:$('#s-key').value.trim(),me:$('#s-me').value.trim(),role:''};
  try{localStorage.setItem('ra-cfg',JSON.stringify(cfg))}catch(_){}
  $('#s-msg').textContent='กำลังเชื่อมต่อ…';
  if(await load(true)){if(cfg.role==='ra'){role='ra';try{localStorage.setItem('ra-role',role)}catch(_){}render()}renderSet(false)}else $('#s-msg').textContent=$('#note').textContent;
});

/* ---------- data ---------- */
let loading=false;
async function load(force){
  if(loading)return false;
  if(!force&&(busy||FSEC.some(k=>uploading[k])||document.hidden))return false;
  loading=true;
  try{
    const r=await api('list');
    if(r.role&&r.role!==cfg.role){cfg.role=r.role;try{localStorage.setItem('ra-cfg',JSON.stringify(cfg))}catch(_){}if(cfg.role!=='ra'&&role==='ra'){role='buy';force=true}}
    items=(r.items||[]).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    note('');
    let repaint=false;
    if(role==='buy'&&cur&&!dirty){const f=items.find(i=>i.id===cur.id);if(f&&f.updatedAt!==cur.updatedAt){cur=clone(f);repaint=true}}
    if(role==='ra'&&sel){const f=items.find(i=>i.id===sel);if(f&&f.updatedAt!==lastSelAt){lastSelAt=f.updatedAt;repaint=true}}
    renderSide();if(repaint||force)role==='buy'?renderForm():renderRA();
    return true;
  }catch(e){note(apiMsg(e));if(force)renderSide();return false}
  finally{loading=false}
}
let lastSelAt=null;
render();
if(!cfg.api||!cfg.key||!cfg.me){renderSet(true);note('ตั้งค่าก่อนใช้งาน: ใส่ชื่อของคุณ รหัสทีม และ URL ของ Apps Script');$('#list').innerHTML='<div class="empty">ยังไม่ได้เชื่อมต่อ</div>'}
else load(true);
setInterval(()=>load(false),20000);
addEventListener('focus',()=>load(false));

}
</script></body></html>
